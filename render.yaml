# Render Blueprint — deploys the Dhumari Public School ERP as a Node web service.
# On Render: New +  →  Blueprint  →  pick this repo. Render reads this file,
# builds the app, and gives you a public https:// link.
#
# The `disk` below keeps the SQLite database (data.db) and uploaded PDFs on a
# persistent volume, so data survives restarts and redeploys. Render disks
# require a paid instance (Starter, ~$7/mo) — see DEPLOY.md. To try it for free
# first, delete the `disk:` block and the DATA_DIR var and set `plan: free`;
# note that free instances have an EPHEMERAL filesystem, so data.db and uploads
# are wiped on every restart/redeploy (fine for a demo, not for real use).
services:
  - type: web
    name: dhumari-public-school-erp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render sets PORT automatically — the server already reads it.
      - key: NODE_VERSION
        value: "20"
      # A long random login-token secret, generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # Keep data.db + uploads/ on the persistent disk mounted below.
      - key: DATA_DIR
        value: /data
    disk:
      name: erp-data
      mountPath: /data
      sizeGB: 1
